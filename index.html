<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Anonymous Chat</h1>
                <button id="new-chat-btn"><i class="fas fa-plus"></i> New Chat</button>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Search chats...">
            </div>
            
            <div class="chat-list" id="chat-list">
                <!-- Recent chats will appear here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area">
            <div class="empty-state">
                <i class="fas fa-comments"></i>
                <h2>Start a new chat</h2>
                <p>Create a room or join one using a link</p>
                <button id="create-room-btn">Create Room</button>
                <div class="room-link-box" id="room-link-box" style="display:none">
                    <input type="text" id="room-link" readonly>
                    <button id="copy-link-btn"><i class="fas fa-copy"></i></button>
                </div>
            </div>

            <div class="active-chat" id="active-chat" style="display:none">
                <div class="chat-header">
                    <div class="partner-info">
                        <span id="partner-id">Anonymous</span>
                        <div class="connection-status">
                            <span class="status-dot"></span>
                            <span id="status-text">Connecting...</span>
                        </div>
                    </div>
                    <button id="leave-room-btn"><i class="fas fa-times"></i></button>
                </div>

                <div class="messages-container" id="message-area">
                    <!-- Messages will appear here -->
                </div>

                <div class="typing-indicator" id="typing-indicator">
                    <span id="typing-text"></span>
                </div>

                <div class="message-input-container">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connection Modal -->
    <div class="modal" id="connection-modal">
        <div class="modal-content">
            <h2>Join a Chat Room</h2>
            <input type="text" id="room-id-input" placeholder="Enter room ID">
            <div class="modal-buttons">
                <button id="join-room-btn">Join Room</button>
                <button id="cancel-join-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
