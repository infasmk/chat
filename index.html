<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }
        
        /* Header */
        .header {
            padding: 15px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        
        .header h1 {
            font-size: 1.2rem;
        }
        
        /* Connection Status */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff7675;
        }
        
        .status-dot.connected {
            background: #00b894;
        }
        
        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        
        /* Sidebar */
        .sidebar {
            width: 100%;
            background: var(--card);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 5;
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }
        
        /* Messages */
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 80%;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-break: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.received {
            background: var(--card);
            border-top-left-radius: 5px;
            margin-right: auto;
        }
        
        .message.sent {
            background: var(--primary);
            color: white;
            border-top-right-radius: 5px;
            margin-left: auto;
        }
        
        .message-status {
            font-size: 0.7rem;
            margin-left: 5px;
        }
        
        /* Input Area */
        .input-area {
            padding: 10px;
            background: var(--card);
            border-top: 1px solid #dfe6e9;
            display: flex;
            gap: 10px;
        }
        
        #message-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #dfe6e9;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }
        
        #send-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Connection Screen */
        .connection-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
        }
        
        .connection-screen h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .connection-screen p {
            margin-bottom: 30px;
            color: var(--text-light);
        }
        
        .btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }
        
        .btn-secondary {
            background: var(--card);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .room-link-container {
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            display: flex;
        }
        
        #room-link {
            flex: 1;
            padding: 10px;
            border: 1px solid #dfe6e9;
            border-radius: 5px 0 0 5px;
            font-size: 0.9rem;
        }
        
        #copy-link {
            padding: 10px;
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
        }
        
        /* Mobile Menu Button */
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            height: 20px;
            padding: 0 15px 5px;
            font-size: 0.8rem;
            color: var(--text-light);
            font-style: italic;
        }
        
        /* Media Queries */
        @media (min-width: 768px) {
            .content {
                flex-direction: row;
            }
            
            .sidebar {
                width: 300px;
                position: relative;
                transform: none;
                border-right: 1px solid #dfe6e9;
            }
            
            .menu-btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Connection Screen (Initial View) -->
        <div class="connection-screen" id="connection-screen">
            <h2>Anonymous Chat</h2>
            <p>Start a secure peer-to-peer chat with anyone</p>
            <button class="btn" id="create-room-btn">Create New Room</button>
            <button class="btn btn-secondary" id="join-room-btn">Join Existing Room</button>
            
            <div class="room-link-container" id="room-link-container" style="display: none;">
                <input type="text" id="room-link" readonly>
                <button id="copy-link">Copy</button>
            </div>
        </div>
        
        <!-- Main App (Hidden until connected) -->
        <div id="main-app" style="display: none;">
            <div class="header">
                <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
                <h1 id="room-title">Anonymous Chat</h1>
                <div class="connection-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>
            
            <div class="content">
                <div class="sidebar" id="sidebar">
                    <!-- Sidebar content would go here -->
                </div>
                
                <div class="chat-area">
                    <div class="messages" id="messages"></div>
                    <div class="typing-indicator" id="typing-indicator"></div>
                    <div class="input-area">
                        <input type="text" id="message-input" placeholder="Type a message..." disabled>
                        <button id="send-button" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // DOM Elements
        const connectionScreen = document.getElementById('connection-screen');
        const mainApp = document.getElementById('main-app');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const roomLinkContainer = document.getElementById('room-link-container');
        const roomLinkInput = document.getElementById('room-link');
        const copyLinkBtn = document.getElementById('copy-link');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const typingIndicator = document.getElementById('typing-indicator');
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const roomTitle = document.getElementById('room-title');

        // PeerJS variables
        let peer;
        let currentPeerId;
        let dataChannel;
        let activeConnection = null;
        let currentRoomId = null;
        let isTyping = false;
        let typingTimeout;

        // Initialize the app
        function initApp() {
            // Generate random peer ID
            currentPeerId = `user-${Math.floor(Math.random() * 1000000)}`;
            
            // Initialize PeerJS with our own simple signaling
            peer = new Peer(currentPeerId, {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                debug: 3
            });

            // PeerJS event handlers
            peer.on('open', (id) => {
                console.log('Connected to signaling server with ID:', id);
                updateConnectionStatus('ready');
            });

            peer.on('connection', (conn) => {
                console.log('Incoming connection from:', conn.peer);
                setupDataConnection(conn);
                handleSuccessfulConnection(conn.peer);
            });

            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                updateConnectionStatus('error');
            });

            // Set up event listeners
            setupEventListeners();

            // Check for room ID in URL
            checkForRoomInURL();
        }

        // Set up UI event listeners
        function setupEventListeners() {
            // Message sending
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Typing indicator
            messageInput.addEventListener('input', handleTyping);

            // Room creation
            createRoomBtn.addEventListener('click', createNewRoom);
            joinRoomBtn.addEventListener('click', showJoinPrompt);
            copyLinkBtn.addEventListener('click', copyRoomLink);

            // Mobile menu
            menuBtn.addEventListener('click', toggleSidebar);
        }

        // Create a new chat room
        function createNewRoom() {
            currentRoomId = `room-${Math.floor(Math.random() * 1000000)}`;
            const roomLink = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
            
            roomLinkInput.value = roomLink;
            roomLinkContainer.style.display = 'flex';
            createRoomBtn.style.display = 'none';
            
            // Update UI
            roomTitle.textContent = `Room: ${currentRoomId.slice(0, 6)}...`;
            
            // Wait for someone to join
            updateConnectionStatus('waiting');
        }

        // Show join room prompt
        function showJoinPrompt() {
            const roomId = prompt('Enter the Room ID:');
            if (roomId) {
                joinRoom(roomId);
            }
        }

        // Join a room
        function joinRoom(roomId) {
            if (!roomId || roomId === currentPeerId) {
                alert('Invalid Room ID');
                return;
            }

            updateConnectionStatus('connecting');
            
            // Connect to the other peer
            const conn = peer.connect(roomId, {
                reliable: true,
                serialization: 'json'
            });
            
            setupDataConnection(conn);
            handleSuccessfulConnection(roomId);
        }

        // Set up data connection
        function setupDataConnection(conn) {
            dataChannel = conn;
            activeConnection = conn.peer;
            
            // Data channel event handlers
            conn.on('data', (data) => {
                switch (data.type) {
                    case 'message':
                        displayMessage(data.text, false);
                        // Send read receipt
                        if (dataChannel) {
                            dataChannel.send({ 
                                type: 'read_receipt', 
                                messageId: data.messageId 
                            });
                        }
                        break;
                        
                    case 'typing':
                        updateTypingIndicator(data.isTyping);
                        break;
                        
                    case 'read_receipt':
                        updateMessageStatus(data.messageId, 'read');
                        break;
                }
            });
            
            conn.on('open', () => {
                console.log('Data connection established with:', conn.peer);
                updateConnectionStatus('connected');
                
                // Enable messaging
                messageInput.disabled = false;
                sendButton.disabled = false;
            });
            
            conn.on('close', () => {
                console.log('Connection closed');
                updateConnectionStatus('disconnected');
                dataChannel = null;
                activeConnection = null;
                
                // Disable messaging
                messageInput.disabled = true;
                sendButton.disabled = true;
            });
            
            conn.on('error', (err) => {
                console.error('Connection error:', err);
                updateConnectionStatus('error');
            });
        }

        // Handle successful connection
        function handleSuccessfulConnection(peerId) {
            connectionScreen.style.display = 'none';
            mainApp.style.display = 'block';
            roomTitle.textContent = `Connected to: ${peerId.slice(0, 6)}...`;
        }

        // Send a message
        function sendMessage() {
            const messageText = messageInput.value.trim();
            if (!messageText || !dataChannel) return;
            
            const messageId = Date.now().toString();
            const messageData = {
                type: 'message',
                text: messageText,
                messageId: messageId
            };
            
            // Display message locally
            displayMessage(messageText, true, messageId);
            
            // Send message through data channel
            dataChannel.send(messageData);
            
            // Clear input
            messageInput.value = '';
        }

        // Display a message
        function displayMessage(text, isSent = false, messageId = null) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isSent ? 'sent' : 'received'}`;
            
            messageElement.innerHTML = `
                <div>${text}</div>
                ${isSent ? `<div class="message-time">${formatTime()} <span class="message-status" id="status-${messageId}">✓</span></div>` : ''}
            `;
            
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Update message status
        function updateMessageStatus(messageId, status) {
            const statusElement = document.getElementById(`status-${messageId}`);
            if (statusElement) {
                if (status === 'delivered') {
                    statusElement.textContent = '✓✓';
                } else if (status === 'read') {
                    statusElement.textContent = '✓✓✓';
                    statusElement.style.color = '#00b894';
                }
            }
        }

        // Handle typing indicator
        function handleTyping() {
            if (!isTyping) {
                isTyping = true;
                if (dataChannel) {
                    dataChannel.send({ type: 'typing', isTyping: true });
                }
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                if (dataChannel) {
                    dataChannel.send({ type: 'typing', isTyping: false });
                }
            }, 1000);
        }

        // Update typing indicator
        function updateTypingIndicator(isTyping) {
            typingIndicator.textContent = isTyping ? 'Anonymous is typing...' : '';
        }

        // Update connection status
        function updateConnectionStatus(status) {
            switch (status) {
                case 'ready':
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Ready';
                    break;
                case 'waiting':
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Waiting for peer...';
                    break;
                case 'connecting':
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connecting...';
                    break;
                case 'connected':
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = 'Connected';
                    break;
                case 'disconnected':
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Disconnected';
                    break;
                case 'error':
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connection error';
                    break;
            }
        }

        // Copy room link
        function copyRoomLink() {
            roomLinkInput.select();
            document.execCommand('copy');
            
            // Visual feedback
            copyLinkBtn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => {
                copyLinkBtn.innerHTML = 'Copy';
            }, 2000);
        }

        // Toggle sidebar (mobile)
        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

        // Format time
        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Check for room ID in URL
        function checkForRoomInURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            
            if (roomId) {
                createNewRoom();
                setTimeout(() => {
                    // Auto-join if we're the second user
                    if (peer.id !== roomId) {
                        joinRoom(roomId);
                    }
                }, 1000);
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
